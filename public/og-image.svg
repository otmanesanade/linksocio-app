<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#090E17" />
      <stop offset="100%" stop-color="#111C2E" />
    </linearGradient>

    <!-- Teal Gradient Accent -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="50%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Ambient Glow Spheres in Corners -->
  <circle cx="1050" cy="120" r="280" fill="#14B8A6" opacity="0.12" filter="url(#glow)" />
  <circle cx="150" cy="520" r="240" fill="#0D9488" opacity="0.10" filter="url(#glow)" />

  <!-- Border Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="28" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2" />

  <!-- Logo Mark -->
  <g transform="translate(100, 110)">
    <rect width="110" height="110" rx="28" fill="#1E293B" stroke="rgba(255, 255, 255, 0.1)" stroke-width="2" />
    <g transform="translate(18, 18) scale(0.2)">
      <!-- Modern Interlocking Rings Logo -->
      <rect x="40" y="40" width="180" height="180" rx="90" fill="none" stroke="url(#tealGrad)" stroke-width="40" />
      <rect x="132" y="132" width="180" height="180" rx="90" fill="none" stroke="#FFFFFF" stroke-width="40" />
    </g>
  </g>

  <!-- Brand Typography -->
  <text x="235" y="182" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="800" letter-spacing="-1.5">
    LinkSocio
  </text>

  <!-- Platform Main Tagline -->
  <text x="100" y="310" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.2">
    The All-in-One Creator Storefront
  </text>
  <text x="100" y="375" fill="#2DD4BF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="700" letter-spacing="-0.8">
    Bio Link · Digital Store · Booking Calendar
  </text>

  <!-- Description paragraph -->
  <text x="100" y="440" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400">
    Sell PDF ebooks, digital courses &amp; presets with 91% seller payout and instant WhatsApp alerts.
  </text>

  <!-- Pill Feature Badges -->
  <g transform="translate(100, 495)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="210" height="48" rx="24" fill="rgba(20, 184, 166, 0.15)" stroke="rgba(45, 212, 191, 0.3)" stroke-width="1.5" />
    <text x="24" y="31" fill="#2DD4BF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="600">
      ⚡ 0% Setup Fees
    </text>

    <!-- Badge 2 -->
    <rect x="230" y="0" width="240" height="48" rx="24" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />
    <text x="254" y="31" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="600">
      🛍️ Digital Downloads
    </text>

    <!-- Badge 3 -->
    <rect x="490" y="0" width="220" height="48" rx="24" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />
    <text x="514" y="31" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="600">
      💬 WhatsApp Leads
    </text>

    <!-- Badge 4 -->
    <rect x="730" y="0" width="230" height="48" rx="24" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />
    <text x="754" y="31" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="600">
      🇲🇦 CIH &amp; Bank Payouts
    </text>
  </g>

  <!-- Domain Tag bottom right -->
  <text x="1070" y="525" text-anchor="end" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" letter-spacing="0.5">
    linksocio.com
  </text>
</svg>
